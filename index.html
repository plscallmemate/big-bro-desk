@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F0E9; --surface: #FFFFFF; --surface2: #ECE8DF; --ink: #14131A; --muted: #6B6875; --line: #DDD8CC;
    --accent: #F0401F; --accent-ink: #FFFFFF; --accent-t: #C42D12; --warn: #A86500; --bad: #C62828;
    --c-write: #6B6875; --c-dialog: #A86B00; --c-call: #6246E0; --c-meet: #0E8F5E; --c-signed: #14131A; --c-none: #8A8794;
    --glow: rgba(240, 64, 31, .10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F0E9; --surface: #FFFFFF; --surface2: #ECE8DF; --ink: #14131A; --muted: #6B6875; --line: #DDD8CC;
  --accent: #F0401F; --accent-ink: #FFFFFF; --accent-t: #C42D12; --warn: #A86500; --bad: #C62828;
  --c-write: #6B6875; --c-dialog: #A86B00; --c-call: #6246E0; --c-meet: #0E8F5E; --c-signed: #14131A; --c-none: #8A8794;
  --glow: rgba(240, 64, 31, .10);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(760px 380px at 85% -120px, var(--glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 0 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body::after {
  content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.wrap { max-width: 520px; margin: 0 auto; position: relative; z-index: 2; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent-t); outline-offset: 2px; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes slide { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes avpop { 0% { transform: scale(.6); opacity: 0; } 65% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
#view.in-tab { animation: rise .38s cubic-bezier(.2, .8, .2, 1) both; }
#view.in-card { animation: slide .4s cubic-bezier(.2, .8, .2, 1) both; }
#view.in-tab .item, #view.in-card .item { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 32ms); }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 0 12px;
}
.brandrow { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--font-head); font-weight: 400; font-size: 19px; letter-spacing: -0.045em; text-transform: uppercase; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 3px 0 0; }
.logo { width: 36px; height: 36px; flex: none; background: var(--ink); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
@keyframes spin { to { transform: rotate(360deg); } }
body.busy .logo { animation: spin 1.1s linear infinite; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--muted); transition: transform .12s, border-color .2s, color .2s; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.ghost:active { transform: scale(.95); }

.banner { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 4px 0 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; animation: rise .35s both; }
.banner.demo { border-left-color: var(--c-call); }
.banner.ok { border-left-color: var(--accent-t); }

.hello { margin: 10px 0 22px; }
.hello h2 { font-family: var(--font-head); font-size: 21px; font-weight: 400; letter-spacing: -0.04em; line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
.hero-n { display: block; font-size: 72px; font-weight: 700; line-height: .95; letter-spacing: -0.05em; color: var(--accent-t); margin-bottom: 6px; }
.hello p { margin: 0; color: var(--muted); }

.block { margin: 0 0 22px; }
.block > h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; transition: background .2s, transform .12s; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface2); }
.item:active { transform: scale(.985); }
.item .av { grid-row: 1 / span 2; }
.item .nm { font-weight: 600; overflow-wrap: anywhere; grid-column: 2; }
.item .ds { color: var(--muted); font-size: 13px; grid-column: 2; overflow-wrap: anywhere; }
.item .mt { font-size: 13px; text-align: right; grid-row: 1 / span 2; grid-column: 3; color: var(--muted); }
.mt.hot { color: var(--bad); font-weight: 600; }
.mt.soon { color: var(--ink); font-weight: 600; }
.more { width: 100%; background: var(--surface2); border: 0; border-top: 1px solid var(--line); padding: 12px; color: var(--accent-t); font-weight: 600; transition: background .2s; }
.more:active { background: var(--line); }

.av { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; flex: none; color: #0C0C0F; font-family: var(--font-head); font-weight: 400; font-size: 14px; letter-spacing: -0.04em; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.big { width: 76px; height: 76px; border-radius: 24px; font-size: 24px; animation: avpop .5s cubic-bezier(.2, .8, .2, 1) both; }

.pill { --c: var(--c-none); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--surface)); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.s-write { --c: var(--c-write); } .s-dialog { --c: var(--c-dialog); } .s-call { --c: var(--c-call); }
.s-meet { --c: var(--c-meet); } .s-signed { --c: var(--c-signed); } .s-none { --c: var(--c-none); }
.s-call::before, .s-meet::before { animation: pulse 1.6s ease-out infinite; }

.tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.search { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, box-shadow .2s; }
.search:focus { outline: none; border-color: var(--accent-t); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-t) 22%, transparent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 13px; color: var(--muted); transition: transform .12s, background .2s, color .2s; }
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.back { background: none; border: 0; color: var(--accent-t); padding: 4px 0 12px; font-weight: 600; }
.cardhead { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; align-items: center; }
.cardhead .av { grid-row: 1 / span 2; }
.cardhead h2 { font-family: var(--font-head); font-size: 26px; font-weight: 400; letter-spacing: -0.05em; text-transform: uppercase; line-height: 1.02; margin: 0 0 6px; overflow-wrap: anywhere; grid-column: 2; align-self: end; }
.cardhead .meta { color: var(--muted); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; grid-column: 2; align-self: start; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; padding: 11px 15px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; transition: transform .12s, box-shadow .25s, background .2s; }
.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent); box-shadow: 0 8px 26px -8px var(--accent); }
.btn.sm { padding: 8px 12px; font-size: 13px; }
.btn.bad { color: var(--bad); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 18px; }
.panel .t { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 18px; }
.fact { background: var(--surface); padding: 11px 14px; min-width: 0; }
.fact.wide { grid-column: 1 / -1; }
.fact label, .fact .k { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

      box.replaceChildren(el("h4", { text: "Убрать из Поиска" }));
      if (!ask) { box.append(el("button", { "class": "btn sm bad", type: "button", text: "Удалить из Поиска", onclick: function () { draw(true); } })); return; }
      box.append(el("p", { text: "Строка «" + c.name + "» удалится из вкладки «Поиск». Если ты просто не берёшь артиста, лучше нажми «Не берём»: тогда он не появится снова и история останется." }),
        el("div", { "class": "actions" },
          el("button", { "class": "btn sm bad", type: "button", text: "Да, удалить", onclick: function (e) { e.currentTarget.disabled = true; removeFind(c); } }),
          el("button", { "class": "btn sm", type: "button", text: "Отмена", onclick: function () { draw(false); } })));
    }
    draw(false);
    return box;
  }
  function removeFind(c) {
    toast("Удаляю…");
    function done() {
      var i = rowsS.indexOf(c); if (i >= 0) rowsS.splice(i, 1);
      updateCounts(); toast(live ? "Удалил из Поиска" : "Пример: в таблицу не пишу");
      if (location.hash.slice(1) === lastTab) route(); else location.hash = lastTab;
    }
    if (!live) { done(); return; }
    findRow(TAB_S, colS.name, c.name).then(function (row) {
      if (!row) return Promise.reject({ message: "«" + c.name + "» не найден в таблице, обнови страницу" });
      if (row === 2) {
        // row 2 holds the ARRAYFORMULAs (ratio, "в Artists"): clear the data cells instead of deleting the row
        var chain = Promise.resolve();
        Object.keys(HS).forEach(function (k) { if (k === "ratio" || colS[k] < 0) return; chain = chain.then(function () { return writeCell(TAB_S, colS[k], 2, ""); }); });
        return chain;
      }
      return mcpH.callTool(SERVER, "update_spreadsheet", { spreadsheetId: SHEET_ID, requests: [{ deleteDimension: { range: { sheetId: GID_S, dimension: "ROWS", startIndex: row - 1, endIndex: row } } }] }, { cache: false });
    }).then(done, function (err) { toast(errMsg(err), true); route(); });
  }
  function renderFind(i) {
    var c = rowsS[i];
    if (!c) { view.replaceChildren(el("div", { "class": "empty", text: "Артист не найден." })); return; }
    var inA = artistNames()[key(c.name)];
    var out = el("div");
    out.append(el("button", { "class": "back", type: "button", text: "← К списку", onclick: function () { location.hash = lastTab; } }));
    var head = el("div", { "class": "cardhead" }, avatar(c.name, true), el("h2", { text: c.name }));
    var meta = el("div", { "class": "meta" });
    var d = pd(c.date); if (d) meta.append(el("span", { text: "найден " + fmtFull(d) }));
    if (c.finder) meta.append(el("span", { text: "· нашёл: " + c.finder }));
    if (c.found) meta.append(el("span", { text: "· " + c.found }));
    if (c.drop) meta.append(el("span", { text: "· " + c.drop }));
    if (c.decision) meta.append(el("span", { "class": "pill s-" + (c.decision === "Пишем" ? "signed" : c.decision === "Смотрю" ? "dialog" : "none"), text: c.decision }));
    head.append(meta); out.append(head);

    var actions = el("div", { "class": "actions" });
    var ym = /^https:\/\/music\.yandex\.ru\/artist\/\d+/.test(c.ym) ? c.ym : null;
    if (ym) actions.append(linkBtn(ym, "Яндекс Музыка", true));
    else if (safeUrl(c.ym)) actions.append(linkBtn(c.ym, "ЯМ (ссылка не на артиста)"));
    var ig = safeUrl(c.ig), tt = safeUrl(c.tt), t = tgUrl(c.tg);
    if (ig) actions.append(linkBtn(ig, "Инстаграм"));
    if (tt) actions.append(linkBtn(tt, "ТикТок"));
    if (t) actions.append(linkBtn(t.url, "Телеграм " + t.handle));
    out.append(actions);

    var n = pnum(c.listeners), l = pnum(c.likes);
    var m = el("div", { "class": "row" },
      el("div", null, bigEl(n), el("div", { "class": "small", text: "слушателей" })),
      el("div", null, bigEl(l), el("div", { "class": "small", text: "лайков" })),
      el("div", null, el("div", { "class": "big", text: n && l != null ? (l / n * 100).toFixed(1).replace(".", ",") + "%" : "—" }), el("div", { "class": "small", text: "лайки / слушатели" })));
    var mbox = el("div", { "class": "metrics" }, m);
    var subs = [["Инст", c.igf], ["ТТ", c.ttf], ["ТГ", c.tgf]].filter(function (x) { return pnum(x[1]) != null; }).map(function (x) { return x[0] + " " + num(pnum(x[1])); });
    if (subs.length) mbox.append(el("div", { "class": "small", text: "Подписчики: " + subs.join(" · ") }));
    mbox.append(deltaEditor(TAB_S, c));
    if (c.dyn) mbox.append(el("div", { "class": "small", text: "Динамика: " + c.dyn }));
    out.append(mbox);
    if (c.comment) out.append(el("div", { "class": "text" }, el("h4", { text: "Комментарий" }), el("p", { text: c.comment })));

    var dec = el("div", { "class": "panel" }, el("p", { "class": "t", text: "Решение" }));
    if (inA) {
      dec.append(el("p", { "class": "hint", text: "Он уже в Artists со статусом «" + (inA.status || "—") + "»." }),
        el("div", { "class": "row" }, el("button", { "class": "btn sm", type: "button", text: "Открыть карточку", onclick: function () { openArtist(inA); } })));
    } else {
      var row = el("div", { "class": "row" });
      row.append(el("button", { "class": "btn sm primary", type: "button", text: "Пишем: в Artists", onclick: function () { promote(c); } }));
      row.append(el("button", { "class": "btn sm", type: "button", text: "Смотрю", onclick: function () { save(TAB_S, c, [{ k: "decision", v: "Смотрю" }]); } }));
      row.append(el("button", { "class": "btn sm bad", type: "button", text: "Не берём", onclick: function () { save(TAB_S, c, [{ k: "decision", v: "Не берём" }]); } }));
      if (c.decision) row.append(el("button", { "class": "btn sm", type: "button", text: "Сбросить", onclick: function () { save(TAB_S, c, [{ k: "decision", v: "" }]); } }));
      dec.append(row, el("p", { "class": "hint", text: "«Пишем» создаёт строку в Artists: статус «Не написал», ответственный " + (c.finder || RESP_DEFAULT) + ", ссылки и лейбл из Поиска." }));
    }
    out.append(dec);
    out.append(removeFindBlock(c));
    view.replaceChildren(out);
    window.scrollTo(0, 0);
  }

  // ---------- routing ----------
  var TABS = ["today", "tasks", "artists", "search", "mine"];
  function route() {
    var h = location.hash.slice(1) || "today", ma = h.match(/^artist-(\d+)$/), mf = h.match(/^find-(\d+)$/);
    var tab = ma || mf ? lastTab : (TABS.indexOf(h) >= 0 ? h : "today");
    if (!ma && !mf) lastTab = tab;
    TABS.forEach(function (t) {
      var b = document.getElementById("tab-" + t);
      if (t === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    document.getElementById("ind").style.transform = "translateX(" + TABS.indexOf(tab) * 100 + "%)";
    updateBusy();
    if (!loaded) { skeleton(); return; }
    var y = window.scrollY;
    if (ma) renderCard(+ma[1]);
    else if (mf) renderFind(+mf[1]);
    else if (tab === "artists") renderArtists();
    else if (tab === "search") renderSearch();
    else if (tab === "tasks") renderTasks();
    else if (tab === "mine") renderMine();
    else renderToday();
    animateView(!!(ma || mf), h);
    if (!ma && !mf) window.scrollTo(0, y);
  }
  document.querySelectorAll("nav.bar button").forEach(function (b) { b.addEventListener("click", function () { location.hash = b.getAttribute("data-tab"); }); });
  window.addEventListener("hashchange", function () { route(); if (!/^(artist|find)-/.test(location.hash.slice(1))) window.scrollTo(0, 0); });
  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("datestr").textContent = longDate(TODAY);
  route();
  load();
})();
</script>
</body>
</html>
